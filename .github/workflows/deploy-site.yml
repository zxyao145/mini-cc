name: Publish MiniCC release

# Publishes verified container images and the Chrome extension for each release.
# Requires the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets.
on:
  release:
    types: [published]

permissions:
  contents: read

env:
  MINICC_VERSION: ${{ github.event.release.tag_name }}
  IMAGE_PREFIX: ghcr.io/zxyao145/minicc

defaults:
  run:
    shell: bash

jobs:
  build-images:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.release.outputs.artifact-name }}
    steps:
      - name: Validate the Release tag
        id: release
        run: |
          number='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          pattern="^v${number}\.${number}\.${number}(-${identifier}(\.${identifier})*)?$"
          if [[ ! "$MINICC_VERSION" =~ $pattern || ${#MINICC_VERSION} -gt 128 ]]; then
            echo "Use a Docker-compatible release tag such as v1.0.1 or v1.0.1-rc.1 (at most 128 characters)." >&2
            exit 1
          fi
          echo "artifact-name=minicc-images-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - run: dotnet test --configuration Release
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      - uses: docker/setup-buildx-action@v4

      - name: Build and load release images
        run: |
          build_args=(
            --platform linux/amd64 --load
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            --label "org.opencontainers.image.revision=$GITHUB_SHA"
            --label "org.opencontainers.image.version=$MINICC_VERSION"
          )
          docker buildx build "${build_args[@]}" -t "$IMAGE_PREFIX-api:$MINICC_VERSION" -f src/server/Dockerfile .
          docker buildx build "${build_args[@]}" -t "$IMAGE_PREFIX-web:$MINICC_VERSION" -f src/web/Dockerfile --build-arg NEXT_PUBLIC_API_URL=/api .
          docker buildx build "${build_args[@]}" -t "$IMAGE_PREFIX-lb:$MINICC_VERSION" -f src/ng/Dockerfile src/ng

      - run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Smoke-test both Compose stacks
        run: |
          for base in docker-compose.sqlite.yaml docker-compose.yaml; do
            (
              compose=(docker compose -p minicc-release-smoke -f "deploy/$base" -f deploy/docker-compose.ghcr.yaml)
              cleanup() {
                if [[ $? -ne 0 ]]; then
                  "${compose[@]}" logs --no-color || true
                fi
                "${compose[@]}" down --volumes
              }
              trap cleanup EXIT

              if [[ "$base" == docker-compose.yaml ]]; then
                "${compose[@]}" pull db
              fi
              "${compose[@]}" up -d --no-build --pull never
              for path in /pages/login /api/account/current; do
                curl --fail --silent --show-error --output /dev/null --max-time 5 \
                  --retry 30 --retry-delay 2 --retry-all-errors "http://127.0.0.1:5000$path"
              done
              node .github/scripts/smoke-release.mjs
            )
          done

      - name: Save the verified images
        run: |
          docker save --output "$RUNNER_TEMP/minicc-images.tar" \
            "$IMAGE_PREFIX-api:$MINICC_VERSION" "$IMAGE_PREFIX-web:$MINICC_VERSION" "$IMAGE_PREFIX-lb:$MINICC_VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release.outputs.artifact-name }}
          path: ${{ runner.temp }}/minicc-images.tar
          retention-days: 7
          if-no-files-found: error

  publish-images:
    needs: build-images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    concurrency:
      group: publish-images-${{ github.event.release.tag_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-images.outputs.artifact-name }}
          path: ${{ runner.temp }}

      - name: Load the verified images
        run: docker load --input "$RUNNER_TEMP/minicc-images.tar"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images and verify registry digests
        run: |
          summary=("Commit: \`$GITHUB_SHA\`" "" "| Image | Manifest digest |" "| --- | --- |")
          for service in api web lb; do
            image="$IMAGE_PREFIX-$service:$MINICC_VERSION"
            docker push "$image" | tee "$RUNNER_TEMP/push-$service.log"
            pushed=$(awk '$2 == "digest:" {print $3}' "$RUNNER_TEMP/push-$service.log")
            remote=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -er '.digest')
            if [[ ! "$pushed" =~ ^sha256:[0-9a-f]{64}$ || "$remote" != "$pushed" ]]; then
              printf 'Digest mismatch for %s (push: %s, registry: %s)\n' "$image" "$pushed" "$remote" >&2
              exit 1
            fi
            summary+=("| \`$image\` | \`$remote\` |")
          done
          printf '%s\n' "${summary[@]}" >> "$GITHUB_STEP_SUMMARY"

  publish-extension:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter minicc-extension test
      - run: pnpm build:ext

      - name: Package the Chrome extension
        working-directory: src/web-extension/dist
        run: |
          zip -q -r -X "$RUNNER_TEMP/minicc-chrome.zip" .
          unzip -tq "$RUNNER_TEMP/minicc-chrome.zip"

      - name: Attach ZIP to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(gh release view --json assets --jq '.assets[].name' -- "$MINICC_VERSION")
          if ! grep -Fxq minicc-chrome.zip <<< "$assets"; then
            gh release upload -- "$MINICC_VERSION" "$RUNNER_TEMP/minicc-chrome.zip"
          fi

  deploy:
    needs: [publish-images, publish-extension]
    if: ${{ success() && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-site
      cancel-in-progress: false
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json
          cache: true
          cache_dependency_path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build the site for this release
        env:
          PUBLIC_MINICC_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          : "${PUBLIC_MINICC_RELEASE_TAG:?Missing Release tag}"
          pnpm build

      - name: Include the Chrome extension from this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/downloads
          gh release download "$MINICC_VERSION" --pattern minicc-chrome.zip --output dist/downloads/minicc-chrome-latest.zip
          unzip -tq dist/downloads/minicc-chrome-latest.zip

      - name: Deploy to Cloudflare
        run: npx --yes wrangler@4.163.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
