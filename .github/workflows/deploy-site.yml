name: Deploy site

# Attaches the Chrome extension to published releases and deploys the product site.
# Requires the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets.
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-extension:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter minicc-extension test
      - run: pnpm build:ext

      - name: Package the Chrome extension
        working-directory: src/web-extension/dist
        run: zip -q -r -X "$RUNNER_TEMP/minicc-chrome.zip" .

      - name: Attach ZIP to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          if ! grep -Fxq minicc-chrome.zip <<< "$assets"; then
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/minicc-chrome.zip"
          fi

  deploy:
    needs: publish-extension
    if: ${{ !cancelled() && (github.event_name != 'release' || (needs.publish-extension.result == 'success' && !github.event.release.prerelease)) }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-site
      cancel-in-progress: false
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json
          cache: true
          cache_dependency_path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Include the latest Chrome extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/downloads
          gh release download --pattern minicc-chrome.zip --output dist/downloads/minicc-chrome-latest.zip
          unzip -tq dist/downloads/minicc-chrome-latest.zip

      - name: Deploy to Cloudflare
        run: npx --yes wrangler@4.163.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
