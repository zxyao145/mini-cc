<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./popup.scss" />
  <script type="module" src="./popup.ts"></script>
</head>
<body>
  <div id="popup-container">
    <header class="header">
      <h1 class="title">MiniCC</h1>
      <p class="subtitle">Save to read later</p>
      <button id="settings-btn" class="settings-btn" type="button" aria-label="Settings" title="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </header>
    
    <main class="main">
      <div id="status" class="status"></div>
      
      <div id="content-preview" class="content-preview hidden">
        <h3 id="preview-title" class="preview-title"></h3>
        <p id="preview-author" class="preview-author"></p>
        <p id="preview-url" class="preview-url"></p>
      </div>
      
      <div class="actions">
        <button id="save-article-btn" class="btn btn-primary">Save Article</button>
        <button id="save-link-btn" class="btn btn-secondary">Save Link</button>
        <button id="copy-md-btn" class="btn btn-secondary">Copy Markdown</button>
      </div>
      
      <div id="settings-panel" class="settings-panel hidden">
        <label for="api-url">API URL:</label>
        <input type="text" id="api-url" placeholder="http://localhost:5000" />
        <input type="text" id="api-ak" placeholder="api-key" />
        <button id="save-settings-btn" class="btn btn-small">Save</button>
      </div>
    </main>
  </div>
</body>
</html>
